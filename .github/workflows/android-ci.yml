# Otomatik bekçi: her gönderimde bütün testler, lint ve ekran görüntüsü karşılaştırması GitHub'da çalışır.
# Bir şey bozulursa (test kırılır, lint hata verir ya da önemli bir ekran istemeden değişirse) kırmızı uyarı çıkar.
# Raporlar başarısız çalıştırmanın "Artifacts" bölümünden indirilir.
name: Android denetim

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testler ve lint
        run: ./gradlew --continue testDebugUnitTest lintRelease

      - name: Ekran görüntüsü karşılaştırma
        run: ./gradlew testDebugUnitTest --tests 'com.example.UiGoldenTest' -Proborazzi.test.verify=true --rerun

      - name: Raporları sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raporlar
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
            app/build/test-results/
          retention-days: 7
