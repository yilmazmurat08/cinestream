<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kaydırma oyunu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E9A8F5}a:hover{color:#F5D0FB}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E071A; color: #F4F1F8; font-family: Manrope, sans-serif; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 4px">
<button aria-label="Geri" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #F4F1F8; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="color: #D4A853; font-size: 11px; font-weight: 700; letter-spacing: 3px">OYUN · PRO</div>
<div style="font-family: 'DM Serif Display', serif; font-style: italic; font-size: 24px">Kaydır, beğen</div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #C9C3D3">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#D946EF" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.4 5 7 5c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 3.6 0 5.8 3.6 4.5 6.8C19.5 16.4 12 21 12 21z"></path></svg>
{{likedCount}} eklendi
</div>
</div>

<div style="display: flex; justify-content: center; gap: 6px; padding: 14px 0 6px">
<div style="padding: 7px 16px; border-radius: 16px; background: #F4F1F8; color: #140B22; font-size: 13px; font-weight: 700">Tümü</div>
<div style="padding: 7px 16px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #C9C3D3; font-size: 13px; font-weight: 600">Film</div>
<div style="padding: 7px 16px; border-radius: 16px; background: rgba(255,255,255,0.08); color: #C9C3D3; font-size: 13px; font-weight: 600">Dizi</div>
</div>

<div style="position: relative; margin: 14px 24px 0; height: 540px">
<div style="position: absolute; left: 14px; right: 14px; top: 14px; bottom: -10px; border-radius: 26px; background: #1C1230; border: 1px solid rgba(255,255,255,0.06)"></div>
<div style="position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: {{card.bg}}; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 50px rgba(0,0,0,0.55); transform: rotate({{tilt}}deg); transition: transform 0.25s ease">
<div style="position: absolute; top: 18px; left: 18px; font-size: 12px; color: rgba(255,255,255,0.55)">[Poster: {{card.title}}]</div>
<sc-if value="{{showStamp}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 46px; right: 20px; transform: rotate(10deg); border: 3px solid {{stampColor}}; color: {{stampColor}}; border-radius: 10px; padding: 4px 12px; font-weight: 800; font-size: 20px; letter-spacing: 2px">{{stampText}}</div>
</sc-if>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 20px 20px; background: linear-gradient(to top, rgba(10,5,18,0.96) 55%, rgba(10,5,18,0)); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<div style="background: #F5C518; color: #111; font-weight: 800; font-size: 12px; border-radius: 5px; padding: 2px 6px">IMDb</div>
<div style="font-weight: 700; font-size: 15px">{{card.imdb}}</div>
<div style="color: #A79FB5; font-size: 13px">· {{card.year}} · {{card.kind}}</div>
</div>
<div style="font-size: 26px; font-weight: 800; line-height: 1.1">{{card.title}}</div>
<div style="color: #D4A853; font-size: 13px; font-weight: 600">{{card.genre}}</div>
<div style="color: #CFC8DA; font-size: 14px; line-height: 1.45">{{card.plot}}</div>
</div>
</div>
</div>

<div style="display: flex; justify-content: center; align-items: center; gap: 36px; padding-top: 30px">
<button aria-label="Geç" onClick="{{pass}}" style="width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #F87171; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<button aria-label="Listeme ekle" onClick="{{like}}" style="width: 72px; height: 72px; border-radius: 36px; background: #D946EF; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(217,70,239,0.45)">
<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.4 5 7 5c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 3.6 0 5.8 3.6 4.5 6.8C19.5 16.4 12 21 12 21z"></path></svg>
</button>
</div>
<div style="text-align: center; color: #8E879C; font-size: 12px; padding-top: 12px">Sola kaydır: geç · Sağa kaydır: Listeme ekle · TV'de sol/sağ tuşu</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { i: 0, liked: 0, last: null };
this.cards = [
{ title: 'Interstellar', year: '2014', kind: 'Film', imdb: '8.7', genre: 'Bilim Kurgu · Dram · Macera', plot: 'Dünya yaşanmaz hâle gelirken bir grup kâşif, insanlığa yeni bir yuva bulmak için bir solucan deliğinden geçer.', bg: 'linear-gradient(160deg, #23324A 0%, #120B1E 70%)' },
{ title: 'La Brea', year: '2021', kind: 'Dizi', imdb: '5.6', genre: 'Bilim Kurgu · Dram', plot: 'Los Angeles’ın ortasında açılan dev bir çukur, insanları tarih öncesi bir dünyaya sürükler.', bg: 'linear-gradient(160deg, #3A2A1A 0%, #140B12 70%)' },
{ title: 'The Dark Knight', year: '2008', kind: 'Film', imdb: '9.0', genre: 'Aksiyon · Suç · Dram', plot: 'Batman, Gotham’ı kaosa sürükleyen Joker’e karşı en zor sınavını verir.', bg: 'linear-gradient(160deg, #1E2630 0%, #0D0A14 70%)' },
{ title: 'Inception', year: '2010', kind: 'Film', imdb: '8.8', genre: 'Bilim Kurgu · Aksiyon', plot: 'Rüyalara sızarak fikir çalan bir hırsız, bu kez birinin zihnine fikir yerleştirmek zorundadır.', bg: 'linear-gradient(160deg, #3B1E55 0%, #120B1E 70%)' }
];
}
renderVals() {
const s = this.state;
const card = this.cards[s.i % this.cards.length];
const next = (action) => {
this.setState({ last: action, liked: s.liked + (action === 'like' ? 1 : 0) });
clearTimeout(this.t);
this.t = setTimeout(() => this.setState({ i: this.state.i + 1, last: null }), 450);
};
return {
card: card,
likedCount: s.liked,
showStamp: s.last !== null,
stampText: s.last === 'like' ? 'LİSTEME' : 'GEÇ',
stampColor: s.last === 'like' ? '#4ADE80' : '#F87171',
tilt: s.last === 'like' ? 6 : (s.last === 'pass' ? -6 : 0),
like: () => next('like'),
pass: () => next('pass')
};
}
componentWillUnmount() { clearTimeout(this.t); }
}
</script>
</body>
</html>
