<!doctype html>
<!--
  Play mağazası telefon ekran görüntüsü çerçevesi (1080x1920).
  ?tip=telefon&ekran=ekranlar/p01.png&b1=...&b2=...&alt=...   (uygulamanın gerçek ekranı telefon çerçevesinde)
  ?tip=tv&ekran=ekranlar/tv.png&b1=...&b2=...&alt=...          (TV ekranı televizyon çerçevesinde)
  ?tip=acilis&alt=...                                            (logo + hayali afiş duvarı)
  ?tip=kapanis                                                   (özellik etiketleri)
  Afişler ve kanallar hayalidir (afis-uretici.html); gerçek içerik, marka ya da kişi yoktur.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --zemin: #0b0814; --mor: #c084fc; --pembe: #e879f9; --turuncu: #fb923c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--zemin); font-family: Poppins, sans-serif; color: #fff; }
  .zemin { position: absolute; inset: 0;
    background:
      radial-gradient(900px 700px at 15% 5%, rgba(124, 58, 237, .55), transparent 60%),
      radial-gradient(800px 800px at 95% 95%, rgba(234, 88, 12, .35), transparent 60%),
      radial-gradient(700px 600px at 90% 35%, rgba(192, 38, 211, .22), transparent 60%),
      var(--zemin); }
  .baslik { position: absolute; top: 140px; left: 0; right: 0; text-align: center; }
  .baslik h1 { margin: 0; font-weight: 800; font-size: 84px; line-height: 1.08; letter-spacing: -2px; }
  .baslik h1 .r { background: linear-gradient(90deg, var(--mor), var(--pembe) 45%, var(--turuncu)); -webkit-background-clip: text; color: transparent; }
  .baslik p { margin: 26px 0 0; font-weight: 500; font-size: 40px; color: #ddd6fe; }
  .telefon { position: absolute; left: 50%; top: 520px; width: 680px; transform: translateX(-50%);
    padding: 18px; border-radius: 92px 92px 0 0; background: #14101f;
    box-shadow: 0 0 0 3px #2a2340, 0 0 120px rgba(192, 132, 252, .35), 0 40px 120px rgba(0,0,0,.6); }
  .telefon img { display: block; width: 100%; border-radius: 76px 76px 0 0; }
  .tv { position: absolute; left: 50%; top: 640px; width: 1000px; transform: translateX(-50%);
    padding: 18px; border-radius: 26px; background: #0f0c18; box-shadow: 0 0 0 3px #2a2340, 0 0 140px rgba(192, 132, 252, .35), 0 40px 120px rgba(0,0,0,.6); }
  .tv img { display: block; width: 100%; border-radius: 12px; }
  .ayak { position: absolute; left: 50%; top: 1240px; transform: translateX(-50%); width: 260px; height: 16px; border-radius: 8px; background: #2a2340; }
  .kumanda { position: absolute; left: 50%; top: 1360px; transform: translateX(-50%) rotate(-8deg); width: 130px; height: 430px; border-radius: 65px;
    background: linear-gradient(#24203a, #15121f); box-shadow: 0 0 0 3px #322a4d, 0 30px 80px rgba(0,0,0,.6); }
  .kumanda::before { content: ''; position: absolute; left: 50%; top: 50px; transform: translateX(-50%); width: 76px; height: 76px; border-radius: 50%; border: 8px solid #7c3aed; box-shadow: 0 0 30px #a855f7; }
  .kumanda::after { content: ''; position: absolute; left: 50%; top: 175px; transform: translateX(-50%); width: 26px; height: 26px; border-radius: 50%; background: #fb923c; box-shadow: 0 0 20px #fb923c; }
  /* açılış: eğik afiş duvarı */
  .duvar { position: absolute; inset: -300px; display: grid; grid-template-columns: repeat(7, 240px); gap: 24px; transform: rotate(-12deg); opacity: .55; }
  .duvar img { width: 240px; height: 360px; border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
  .perde { position: absolute; inset: 0; background: radial-gradient(620px 520px at 50% 50%, rgba(11,8,20,.92), rgba(11,8,20,.55) 70%, rgba(11,8,20,.85)); }
  .logo { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); width: 300px; height: 300px; border-radius: 70px;
    box-shadow: 0 0 0 3px #3b2f5c, 0 0 140px rgba(192, 132, 252, .6); overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .ad { position: absolute; top: 960px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 130px; letter-spacing: -3px; }
  .ad .r { background: linear-gradient(90deg, var(--mor), var(--pembe) 45%, var(--turuncu)); -webkit-background-clip: text; color: transparent; }
  .slogan { position: absolute; top: 1140px; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 500; color: #ede9fe; }
  .etiketler { position: absolute; top: 1320px; left: 90px; right: 90px; display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; }
  .etiketler span { padding: 18px 34px; border-radius: 999px; font-size: 34px; font-weight: 600; background: rgba(42, 40, 56, .7); border: 2px solid rgba(255,255,255,.18); }
  .not { position: absolute; bottom: 90px; left: 0; right: 0; text-align: center; font-size: 30px; color: #a78bfa; }
</style>
</head>
<body>
<div class="zemin"></div>
<div id="icerik"></div>
<script>
const q = new URLSearchParams(location.search);
const tip = q.get('tip') || 'telefon';
const esc = (s) => (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const icerik = document.getElementById('icerik');
const baslik = `<div class="baslik"><h1>${esc(q.get('b1'))}<br><span class="r">${esc(q.get('b2'))}</span></h1><p>${esc(q.get('alt'))}</p></div>`;
const AFISLER = ['gece-yarisi-treni', 'tas-kale', 'mavi-dalga', 'kayip-harita', 'sonsuz-yorunge', 'sessiz-sehir', 'kizil-sinir',
  'ruzgarin-oglu', 'golge-avcisi', 'beyaz-sessizlik', 'altin-vadi', 'karanlik-orman', 'mavi-fener', 'daglarin-kizi', 'eski-konak'];
if (tip === 'telefon') icerik.innerHTML = baslik + `<div class="telefon"><img src="${esc(q.get('ekran'))}"></div>`;
else if (tip === 'tv') icerik.innerHTML = baslik + `<div class="tv"><img src="${esc(q.get('ekran'))}"></div><div class="ayak"></div><div class="kumanda"></div>`;
else if (tip === 'acilis' || tip === 'kapanis') {
  const duvar = Array.from({ length: 49 }, (_, k) => `<img src="afisler/${AFISLER[(k * 5) % AFISLER.length]}.jpg">`).join('');
  icerik.innerHTML = `<div class="duvar">${duvar}</div><div class="perde"></div>
    <div class="logo"><img src="logo.jpg"></div>
    <div class="ad">Cine<span class="r">Stream</span></div>
    <div class="slogan">${esc(q.get('alt'))}</div>` +
    (tip === 'kapanis' ? `<div class="etiketler">${['Canlı TV', 'Film', 'Dizi', 'Yayın akışı', 'Fragman', 'Yapay zekâ', 'Android TV'].map((t) => `<span>${t}</span>`).join('')}</div>
      <div class="not">Kendi M3U / Xtream listenle · İçerik sağlamaz</div>` : '');
}
</script>
</body>
</html>
