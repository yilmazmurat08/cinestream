<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:600px;position:relative;overflow:hidden;background:#120A24}
.bg{position:absolute;inset:0;background:
 radial-gradient(420px 300px at 50% 44%, rgba(255,214,102,.55), transparent 70%),
 radial-gradient(640px 460px at 50% 46%, rgba(232,121,249,.95), rgba(147,51,234,.55) 46%, transparent 74%),
 radial-gradient(520px 320px at 100% 100%, rgba(124,255,107,.26), transparent 70%),
 radial-gradient(520px 320px at 0% 100%, rgba(124,255,107,.18), transparent 70%),
 linear-gradient(#3b1273,#1a0b38 60%,#120A24)}
.rays{position:absolute;left:50%;top:46%;width:1300px;height:1300px;transform:translate(-50%,-50%);
 background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.085) 0 6deg, transparent 6deg 18deg);
 -webkit-mask-image:radial-gradient(circle, #000 0, #000 22%, transparent 56%);mask-image:radial-gradient(circle,#000 0,#000 22%,transparent 56%)}
.p{position:absolute;width:190px;height:285px;border-radius:16px;overflow:hidden}
.p img{width:100%;height:100%;display:block}
.l1{left:22px;top:66px;transform:perspective(700px) rotateY(36deg) rotate(-7deg);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 0 2.5px rgba(253,230,138,.9),0 0 38px rgba(253,224,71,.65)}
.l2{left:170px;top:36px;transform:perspective(700px) rotateY(28deg) rotate(-4deg) scale(.97);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 0 2.5px rgba(240,171,252,.9),0 0 38px rgba(232,121,249,.7)}
.l3{left:310px;top:22px;transform:perspective(700px) rotateY(20deg) rotate(-2deg) scale(.9);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 0 2.5px rgba(103,232,249,.85),0 0 34px rgba(34,211,238,.6)}
.r1{right:22px;top:66px;transform:perspective(700px) rotateY(-36deg) rotate(7deg);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 0 2.5px rgba(103,232,249,.9),0 0 38px rgba(34,211,238,.65)}
.r2{right:170px;top:36px;transform:perspective(700px) rotateY(-28deg) rotate(4deg) scale(.97);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 0 2.5px rgba(190,242,100,.9),0 0 38px rgba(124,255,107,.6)}
.r3{right:310px;top:22px;transform:perspective(700px) rotateY(-20deg) rotate(2deg) scale(.9);box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 0 2.5px rgba(253,186,116,.9),0 0 34px rgba(249,115,22,.65)}
.glow{position:absolute;left:50%;top:47%;width:520px;height:520px;transform:translate(-50%,-50%);
 background:radial-gradient(circle,rgba(255,236,170,.75) 0,rgba(255,197,61,.45) 16%,rgba(232,121,249,.55) 34%,rgba(147,51,234,.25) 52%,transparent 68%)}
.ring{position:absolute;left:50%;top:50%;width:560px;height:160px;transform:translate(-50%,-50%) rotate(-14deg);border-radius:50%;
 border:4px solid rgba(255,214,102,.85);box-shadow:0 0 34px rgba(255,197,61,.9), inset 0 0 34px rgba(255,197,61,.4)}
.ring2{position:absolute;left:50%;top:50%;width:660px;height:200px;transform:translate(-50%,-50%) rotate(-14deg);border-radius:50%;border:1.5px solid rgba(124,255,107,.5);box-shadow:0 0 18px rgba(124,255,107,.5)}
.fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,#120A24 97%)}
svg.o{position:absolute}
.sp{position:absolute;border-radius:50%}
</style></head><body>
