<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:600px;position:relative;overflow:hidden;background:#120A24}
.bg{position:absolute;inset:0;background:
 radial-gradient(520px 380px at 50% 46%, rgba(217,70,239,.75), rgba(124,58,237,.35) 45%, transparent 72%),
 radial-gradient(360px 260px at 50% 40%, rgba(255,197,61,.35), transparent 70%),
 radial-gradient(500px 300px at 100% 100%, rgba(124,255,107,.16), transparent 70%),
 radial-gradient(500px 300px at 0% 100%, rgba(124,255,107,.10), transparent 70%),
 linear-gradient(#2a0f52,#120A24)}
.p{position:absolute;width:190px;height:285px;border-radius:14px;background-size:cover;background-position:center;
   box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.14),0 0 34px rgba(217,70,239,.45)}
.p::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(rgba(18,10,36,0) 40%,rgba(18,10,36,.55))}
.l1{left:28px;top:70px;transform:perspective(700px) rotateY(38deg) rotate(-7deg)}
.l2{left:176px;top:44px;transform:perspective(700px) rotateY(30deg) rotate(-4deg) scale(.96)}
.l3{left:312px;top:36px;transform:perspective(700px) rotateY(22deg) rotate(-2deg) scale(.9);opacity:.85}
.r1{right:28px;top:70px;transform:perspective(700px) rotateY(-38deg) rotate(7deg)}
.r2{right:176px;top:44px;transform:perspective(700px) rotateY(-30deg) rotate(4deg) scale(.96)}
.r3{right:312px;top:36px;transform:perspective(700px) rotateY(-22deg) rotate(2deg) scale(.9);opacity:.85}
.fade{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(transparent,#120A24 96%)}
.center{position:absolute;left:50%;top:46%;width:560px;height:560px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,197,61,.38) 0,rgba(217,70,239,.55) 26%,rgba(124,58,237,.30) 48%,transparent 70%)}
.ring{position:absolute;left:50%;top:48%;width:520px;height:150px;transform:translate(-50%,-50%) rotate(-14deg);border-radius:50%;
  border:3px solid rgba(255,197,61,.55);box-shadow:0 0 30px rgba(255,197,61,.55), inset 0 0 30px rgba(255,197,61,.25)}
svg{position:absolute}
.sp{position:absolute;border-radius:50%}
</style></head><body>
<div class="bg"></div>
<div class="p l3" style="background-image:url(golge-avcisi.jpg)"></div>
<div class="p r3" style="background-image:url(kizil-sinir.jpg)"></div>
<div class="p l2" style="background-image:url(sonsuz-yorunge.jpg)"></div>
<div class="p r2" style="background-image:url(eski-konak.jpg)"></div>
<div class="p l1" style="background-image:url(gece-yarisi-treni.jpg)"></div>
<div class="p r1" style="background-image:url(mavi-dalga.jpg)"></div>
<div class="center"></div><div class="ring"></div>
<div class="fade"></div>
<!-- patlamış mısır -->

 <defs><radialGradient id="r" cx=".4" cy=".35"><stop offset="0" stop-color="#9a93ad"/><stop offset=".55" stop-color="#4a4460"/><stop offset="1" stop-color="#1f1a30"/></radialGradient></defs>

</body></html>
